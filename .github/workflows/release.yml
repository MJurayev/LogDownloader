name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Copy frontend to backend
        run: |
          rm -rf backend/web/dist
          cp -r frontend/dist backend/web/dist

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd backend
          go build -ldflags="-s -w" -o ../build/logdownloader-linux-${{ matrix.goarch }} ./cmd

      - name: Build RPM and DEB
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          export VERSION=${VERSION#v}
          envsubst < nfpm.yaml > nfpm-resolved.yaml
          nfpm package --config nfpm-resolved.yaml --packager rpm --target build/
          nfpm package --config nfpm-resolved.yaml --packager deb --target build/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.goarch }}
          path: build/*

  publish:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
