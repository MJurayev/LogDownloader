services:
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    ports:
      - "9428:9428"
    volumes:
      - vl-data:/vlogs

  log-generator:
    image: python:3.12-alpine
    depends_on:
      - victorialogs
    volumes:
      - ./log-generator.py:/app/gen.py:ro
    command: python /app/gen.py

  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - app-data:/app/data
    depends_on:
      - victorialogs

volumes:
  app-data:
  vl-data:
